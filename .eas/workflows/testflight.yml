name: iOS TestFlight release

on:
  push:
    branches: ['main']

defaults:
  image: sdk-57
  tools:
    node: '24.14.0'
    pnpm: '11.18.0'

jobs:
  checks:
    name: Typecheck and test
    steps:
      - uses: eas/checkout
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  build_ios:
    name: Build iOS for TestFlight
    needs: [checks]
    type: build
    params:
      platform: ios
      profile: production

  submit_ios:
    name: Upload to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production
